<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Temporizador Pomodoro: ciclos de trabajo de 25 minutos y descansos cortos de 5 minutos." />
    <title>Temporizador Pomodoro</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="app" data-state="idle" data-phase="work">
      <header class="app__header">
        <h1 class="app__title">Temporizador Pomodoro</h1>
        <p class="app__phase" data-phase-label>Trabajo</p>
      </header>

      <section class="timer" aria-labelledby="timer-heading">
        <h2 class="sr-only" id="timer-heading">Cuenta regresiva</h2>
        <p class="timer__display">
          <time id="time-display" datetime="PT25M0S">25:00</time>
        </p>
      </section>

      <section class="controls" aria-labelledby="controls-heading">
        <h2 class="sr-only" id="controls-heading">Controles del temporizador</h2>
        <button type="button" id="start-btn" class="btn btn--primary">Iniciar</button>
        <button type="button" id="pause-btn" class="btn" disabled>Pausar</button>
        <button type="button" id="reset-btn" class="btn">Reiniciar</button>
      </section>

      <section class="progress" aria-labelledby="progress-heading">
        <h2 class="sr-only" id="progress-heading">Progreso del día</h2>
        <p class="progress__label">Pomodoros completados hoy</p>
        <output id="cycle-counter" class="progress__value">0</output>
      </section>

      <p id="live-region" class="sr-only" aria-live="polite"></p>
    </main>
    <script type="module" src="js/main.js"></script>
  </body>
  </body>
</html>
